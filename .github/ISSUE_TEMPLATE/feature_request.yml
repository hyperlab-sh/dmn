name: Feature request
description: Suggest a change to how dmn remembers, forgets or recalls
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What does this solve? A concrete session where memory got in the way, or was missing, helps most.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
